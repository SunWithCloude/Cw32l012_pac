[package]
name = "cw32l012-pac"
version = "0.1.0"
edition = "2021"
rust-version = "1.60"
description = "Standalone zero-dependency register access crate (PAC) for the CW32L012 Cortex-M0+ MCU (Wuhan Xinyuan / CMSemicon), transcribed from UM V1.4"
categories = ["embedded", "hardware-support", "no-std"]
keywords = ["cw32", "cw32l012", "pac", "register", "cortex-m"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/SunWithCloude/Cw32l012_pac"
documentation = "https://docs.rs/cw32l012-pac"

[package.metadata.docs.rs]
default-target = "thumbv6m-none-eabi"
targets = ["thumbv6m-none-eabi"]

[dependencies]
# 有意保持零依赖：本 crate 是寄存器定义层，只使用 core。

[features]
# 无 feature。中断运行时（向量表 / interrupt! 宏）由 cw32l012-hal 的
# `runtime` feature 提供；单独使用本 crate 时请自备向量表。
